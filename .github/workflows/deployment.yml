name: deploy-staging
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Job Done 1
        run: echo "Hey job 1 done"
  deploy:
    needs: first-job
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Project
        run: pnpm build
      - name: Deploy
        run: echo "Deploying...."
